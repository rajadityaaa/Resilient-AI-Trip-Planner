services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: travel-planner-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=production
      - TRUST_PROXY=true
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    container_name: travel-planner-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    profiles:
      - streamlit
