[project]
name = "travel-planner-agent"
version = "0.1.0"
description = "AI Travel Planner Agent built with LangGraph and Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "google-generativeai>=0.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "plotly>=5.22.0",
    "fpdf2>=2.7.9",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
