[project]
name = "travel-planner-agent"
version = "1.0.0"
description = "AI Travel Planner Agent built with LangGraph, Streamlit and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "google-generativeai>=0.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "plotly>=5.22.0",
    "fpdf2>=2.7.9",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=1.8.2",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
