[project]
name = "travel-planner-agent"
version = "1.0.0"
description = "AI Travel Planner Agent built with LangGraph, Streamlit and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "langgraph>=0.1.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "plotly>=5.22.0",
    "fpdf2>=2.7.9",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=1.8.2",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "prometheus-client>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that make real external network requests (skipped by default, run with -m network)"
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/ui/*",
    "app/streamlit_app.py",
    "app/coordinator_test.py",
    "app/tools/pdf_tools.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
